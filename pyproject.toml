[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biln"
version = "2.0.0"
description = "Bioinformatician's Interactive Lab Notebook - A provenance-tracking CLI"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "Jimmy X Banda" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pandas>=2.0.0",
    "psutil>=5.9.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
pysam = ["pysam>=0.21.0"]

[project.scripts]
biln = "biln.main:main"

[tool.setuptools.packages.find]
where = ["src"]
